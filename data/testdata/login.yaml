module: login
cases:
  # 普通用户登录主流程与认证/字段异常
  - id: LOGIN-002
    title: 登录成功_普通用户正确账号密码
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 200
      forbidden_fields:
        - password
        - password_hash
        - hashed_password

  - id: LOGIN-003
    title: 登录失败_密码错误
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: "Wrong!Passw0rd#2026"
    expected:
      status: 401

  - id: LOGIN-004
    title: 登录失败_账号不存在
    group: standard
    input:
      email: "qa.login.missing.${RUN_ID}@example.com"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 401

  - id: LOGIN-005
    title: 登录失败_邮箱字段缺失
    group: standard
    input:
      password: "$LOGIN_PASSWORD"
    delete_fields:
      - email
    expected:
      status: 422
      error_field: email

  - id: LOGIN-006
    title: 登录失败_密码字段缺失
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: "$LOGIN_PASSWORD"
    delete_fields:
      - password
    expected:
      status: 422
      error_field: password

  - id: LOGIN-007
    title: 登录失败_空密码
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: ""
    expected:
      status: 401

  - id: LOGIN-008-A
    title: 登录失败_邮箱为null
    group: standard
    input:
      email: null
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-008-B
    title: 登录失败_邮箱为数字
    group: standard
    input:
      email: 123
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-009-A
    title: 登录失败_密码为null
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: null
    expected:
      status: 422
      error_field: password

  - id: LOGIN-009-B
    title: 登录失败_密码为数字
    group: standard
    input:
      email: "$LOGIN_EMAIL"
      password: 123
    expected:
      status: 422
      error_field: password

  - id: LOGIN-010-01
    title: 登录失败_邮箱为空字符串
    group: standard
    input:
      email: ""
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-02
    title: 登录失败_邮箱缺少@
    group: standard
    input:
      email: "plainaddress"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-03
    title: 登录失败_邮箱缺少域名
    group: standard
    input:
      email: "qa.login.invalid.03.${RUN_ID}@"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-04
    title: 登录失败_邮箱缺少本地部分
    group: standard
    input:
      email: "@example.com"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-05
    title: 登录失败_邮箱含空格
    group: standard
    input:
      email: "qa login.invalid.05.${RUN_ID}@example.com"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-06
    title: 登录失败_邮箱域名连续点
    group: standard
    input:
      email: "qa.login.invalid.06.${RUN_ID}@example..com"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-011
    title: 登录成功_邮箱全大写
    group: standard
    input:
      email: "$LOGIN_EMAIL_UPPER"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 200

  - id: LOGIN-012
    title: 登录成功_邮箱首尾空格
    group: standard
    input:
      email: "$LOGIN_EMAIL_SPACED"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 200

  # 管理员登录
  - id: LOGIN-001
    title: 登录成功_管理员正确账号密码
    group: admin
    input:
      email: "${ADMIN_EMAIL}"
      password: "${ADMIN_PASSWORD}"
    expected:
      status: 200
      forbidden_fields:
        - password
        - password_hash
        - hashed_password

  # 请求级异常
  - id: LOGIN-013
    title: 登录失败_请求体缺失
    group: request_invalid
    request:
      body: null
      content_type: "application/json"
    expected:
      status: 422

  - id: LOGIN-014
    title: 登录失败_JSON格式错误
    group: request_invalid
    request:
      body: '{"email":'
      content_type: "application/json"
    expected:
      status: 400

  - id: LOGIN-015
    title: 登录失败_ContentType错误
    group: request_invalid
    request:
      body: "email=qa.login.user%40example.com&password=Qa%21User%232026"
      content_type: "application/x-www-form-urlencoded"
    expected:
      status: 415

  # 额外字段与角色字段
  - id: LOGIN-016
    title: 登录成功_额外role字段被忽略
    group: mass_assignment
    input:
      email: "$LOGIN_EMAIL"
      password: "$LOGIN_PASSWORD"
      role: "admin"
    expected:
      status: 200
      verify_role: true

  # 注入/XSS 输入
  - id: LOGIN-017
    title: 登录失败_邮箱SQL注入
    group: security
    input:
      email: "qa' OR '1'='1@example.com"
      password: "$LOGIN_PASSWORD"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-018
    title: 登录失败_密码SQL注入
    group: security
    input:
      email: "$LOGIN_EMAIL"
      password: "' OR '1'='1"
    expected:
      status: 401

  - id: LOGIN-019
    title: 登录失败_密码XSS
    group: security
    input:
      email: "$LOGIN_EMAIL"
      password: "<script>alert(1)</script>"
    expected:
      status: 401

  # /me 鉴权负向
  - id: LOGIN-020
    title: 鉴权失败_未携带Authorization
    group: auth_guard
    headers: {}
    expected:
      status: 401

  - id: LOGIN-021
    title: 鉴权失败_Basic鉴权方案
    group: auth_guard
    headers:
      Authorization: "Basic dGVzdDp0ZXN0"
    expected:
      status: 401

  - id: LOGIN-022-A
    title: 鉴权失败_无效BearerToken
    group: auth_guard
    headers:
      Authorization: "Bearer invalid-token"
    expected:
      status: 401

  - id: LOGIN-022-B
    title: 鉴权失败_篡改BearerToken
    group: auth_guard
    headers:
      Authorization: "Bearer invalid-token-tampered"
    expected:
      status: 401
