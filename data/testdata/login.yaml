module: login
cases:
  # input 覆盖共用账号的默认登录数据，delete_fields 删除字段。
  - id: LOGIN-002
    title: 普通用户用正确凭据登录成功，且可查询本人资料
    group: standard
    expected:
      status: 200
      forbidden_fields:
        - password
        - password_hash
        - hashed_password

  - id: LOGIN-003
    title: 已注册用户输入错误密码，登录返回 401
    group: standard
    input:
      password: "Wrong!Passw0rd#2026"
    expected:
      status: 401

  - id: LOGIN-004
    title: 未注册邮箱尝试登录，返回 401
    group: standard
    input:
      email: "qa.login.missing.{run_id}@example.com"
    expected:
      status: 401

  - id: LOGIN-005
    title: 登录缺少 email 字段，返回 422 并定位到 email
    group: standard
    delete_fields:
      - email
    expected:
      status: 422
      error_field: email

  - id: LOGIN-006
    title: 登录缺少 password 字段，返回 422 并定位到 password
    group: standard
    delete_fields:
      - password
    expected:
      status: 422
      error_field: password

  - id: LOGIN-007
    title: 登录密码为空字符串，返回 401
    group: standard
    input:
      password: ""
    expected:
      status: 401

  - id: LOGIN-008-A
    title: 登录邮箱为 null，返回 422
    group: standard
    input:
      email: null
    expected:
      status: 422
      error_field: email

  - id: LOGIN-008-B
    title: 登录邮箱为数字，返回 422
    group: standard
    input:
      email: 123
    expected:
      status: 422
      error_field: email

  - id: LOGIN-009-A
    title: 登录密码为 null，返回 422
    group: standard
    input:
      password: null
    expected:
      status: 422
      error_field: password

  - id: LOGIN-009-B
    title: 登录密码为数字，返回 422
    group: standard
    input:
      password: 123
    expected:
      status: 422
      error_field: password

  - id: LOGIN-010-01
    title: 登录邮箱为空字符串，返回 422
    group: standard
    input:
      email: ""
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-02
    title: 登录邮箱缺少 @，返回 422
    group: standard
    input:
      email: "plainaddress"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-03
    title: 登录邮箱缺少域名，返回 422
    group: standard
    input:
      email: "qa.login.invalid.03.{run_id}@"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-04
    title: 登录邮箱缺少本地部分，返回 422
    group: standard
    input:
      email: "@example.com"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-05
    title: 登录邮箱内部含空格，返回 422
    group: standard
    input:
      email: "qa login.invalid.05.{run_id}@example.com"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-010-06
    title: 登录邮箱域名含连续点，返回 422
    group: standard
    input:
      email: "qa.login.invalid.06.{run_id}@example..com"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-011
    title: 登录邮箱全部大写，仍可查询本人资料
    group: standard
    email_transform: uppercase
    expected:
      status: 200

  - id: LOGIN-012
    title: 登录邮箱首尾带空格，仍可查询本人资料
    group: standard
    email_transform: surround_with_spaces
    expected:
      status: 200

  - id: LOGIN-ERROR-CONSISTENCY
    title: 密码错误与邮箱未注册返回相同的认证失败文案
    group: error_consistency
    wrong_password: "Wrong!Passw0rd#2026"
    unknown_email: "qa.login.missing.{run_id}@example.com"
    expected:
      status: 401

  # 管理员登录
  - id: LOGIN-001
    title: 管理员用正确凭据登录成功，且资料显示管理员角色
    group: admin
    expected:
      status: 200
      forbidden_fields:
        - password
        - password_hash
        - hashed_password

  # 请求级异常
  - id: LOGIN-013
    title: 登录请求缺少请求体，返回 422
    group: request_invalid
    request:
      body: null
      content_type: "application/json"
    expected:
      status: 422

  - id: LOGIN-014
    title: 登录请求的 JSON 无法解析，返回 400
    group: request_invalid
    request:
      body: '{"email":'
      content_type: "application/json"
    expected:
      status: 400

  - id: LOGIN-015
    title: 登录发送表单，请求返回 415
    group: request_invalid
    request:
      body: "email=qa.login.user%40example.com&password=Qa%21User%232026"
      content_type: "application/x-www-form-urlencoded"
    expected:
      status: 415

  # 额外字段与角色字段
  - id: LOGIN-016
    title: 普通用户登录额外提交 role=admin，资料未返回管理员角色
    group: mass_assignment
    input:
      role: "admin"
    expected:
      status: 200
      verify_role: true

  # 注入/XSS 输入
  - id: LOGIN-017
    title: 登录邮箱含 SQL 注入样式的字符，返回 422
    group: security
    input:
      email: "qa' OR '1'='1@example.com"
    expected:
      status: 422
      error_field: email

  - id: LOGIN-018
    title: 登录密码含 SQL 注入样式的字符，返回 401
    group: security
    input:
      password: "' OR '1'='1"
    expected:
      status: 401

  - id: LOGIN-019
    title: 登录密码含脚本字符，返回 401
    group: security
    input:
      password: "<script>alert(1)</script>"
    expected:
      status: 401

  # /me 鉴权负向
  - id: LOGIN-020
    title: 未携带鉴权头查询本人资料，返回 401
    group: auth_guard
    headers: {}
    expected:
      status: 401

  - id: LOGIN-021
    title: 使用 Basic 方案查询本人资料，返回 401
    group: auth_guard
    headers:
      Authorization: "Basic dGVzdDp0ZXN0"
    expected:
      status: 401

  - id: LOGIN-022-A
    title: 使用无效 Bearer Token 查询本人资料，返回 401
    group: auth_guard
    headers:
      Authorization: "Bearer invalid-token"
    expected:
      status: 401

  - id: LOGIN-022-B
    title: 使用模拟篡改的 Bearer Token 查询本人资料，返回 401
    group: auth_guard
    headers:
      Authorization: "Bearer invalid-token-tampered"
    expected:
      status: 401
